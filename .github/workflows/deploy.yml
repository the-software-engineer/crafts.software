name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          BUILD_VERSION: ${{ github.sha }}

      - uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: 2.42.0

      - name: Load secrets from 1Password
        shell: bash
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_PAGES_DEPLOYMENT_API_TOKEN: op://TSE Systems/github actions - pages deployment/credential
        run: |
          set -euo pipefail
          names=()
          while IFS= read -r -d '' entry; do
            case "${entry#*=}" in op://*) names+=("${entry%%=*}") ;; esac
          done < <(env -0)
          [ "${#names[@]}" -gt 0 ] || { echo "::error::No op:// reference in this step's env"; exit 1; }
          cat >"${RUNNER_TEMP}/export-secrets.sh" <<'EOF'
          set -euo pipefail
          for name in "$@"; do
            [ -n "${!name:-}" ] || { echo "::error::1Password returned an empty value for ${name}"; exit 1; }
          done
          delimiter="ghadelimiter_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          for name in "$@"; do
            while IFS= read -r line; do
              line="${line%$'\r'}"
              case "${line}" in *[![:space:]]*) ;; *) continue ;; esac
              line="${line//%/%25}"
              printf '::add-mask::%s\n' "${line//$'\r'/%0D}"
            done <<<"${!name}"
          done
          for name in "$@"; do
            printf '%s<<%s\n%s\n%s\n' "${name}" "${delimiter}" "${!name}" "${delimiter}"
          done >>"${GITHUB_ENV}"
          EOF
          op run --no-masking --cache=false -- bash "${RUNNER_TEMP}/export-secrets.sh" "${names[@]}"

      - name: Create Pages project if needed
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ env.CLOUDFLARE_PAGES_DEPLOYMENT_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create crafts-software --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_PAGES_DEPLOYMENT_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --commit-dirty=true
