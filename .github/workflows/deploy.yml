name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          BUILD_VERSION: ${{ github.sha }}

      # The one credential this deploy uses comes from 1Password, addressed by
      # a reference committed here. OP_SERVICE_ACCOUNT_TOKEN is the
      # organisation's one GitHub secret, because it is what reads 1Password.
      - uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_PAGES_DEPLOYMENT_API_TOKEN: op://TSE Systems/github actions - pages deployment/credential

      # load-secrets-action exits 0 when `op env ls` recognises no reference,
      # so an unaddressable title exports nothing and the deploy ships a blank
      # credential with every step green.
      - name: Check every reference resolved
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_PAGES_DEPLOYMENT_API_TOKEN:-}" ] || { echo "::error::CLOUDFLARE_PAGES_DEPLOYMENT_API_TOKEN did not load from 1Password"; exit 1; }

      - name: Create Pages project if needed
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ env.CLOUDFLARE_PAGES_DEPLOYMENT_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create crafts-software --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_PAGES_DEPLOYMENT_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --commit-dirty=true
